<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Whiteleaf Interiors Portal</title>
  <meta name="description" content="Secure Management Portal for Whiteleaf Interiors experience design, project portfolio, and client inquiries.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Admin Stylesheet -->
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <div class="login-wrapper">
    <div class="login-bg-grid"></div>

    <div class="login-card">
      <div class="login-header">
        <img src="assets/logo.png" alt="Whiteleaf Interiors" class="login-brand-logo">
        <h1 class="login-title">Executive CMS Portal</h1>
        <p class="login-subtitle">Sign in to manage projects and website contact leads</p>
      </div>

      <!-- Quick Dual Role Login Selector -->
      <div style="background:rgba(255,255,255,0.03); border:1px solid var(--card-border); border-radius:var(--radius-md); padding:16px; margin-bottom:24px;">
        <span style="font-size:0.72rem; font-weight:800; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.08em; display:block; margin-bottom:10px;">Select Role Quick-Fill Credentials:</span>
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
          <button type="button" class="demo-fill-btn" id="btn-fill-superadmin" style="display:flex; flex-direction:column; align-items:flex-start; padding:10px 12px; background:rgba(157,203,71,0.12); border:1px solid rgba(157,203,71,0.3); color:#fff; border-radius:var(--radius-sm); text-align:left; cursor:pointer;">
            <span style="font-weight:800; font-size:0.78rem; color:var(--accent-green);"><i class="fa-solid fa-user-shield"></i> Super Admin</span>
            <span style="font-size:0.68rem; color:var(--text-muted); margin-top:2px;">Full Access (CMS & Leads)</span>
          </button>

          <button type="button" class="demo-fill-btn" id="btn-fill-pm" style="display:flex; flex-direction:column; align-items:flex-start; padding:10px 12px; background:rgba(229,184,105,0.12); border:1px solid rgba(229,184,105,0.3); color:#fff; border-radius:var(--radius-sm); text-align:left; cursor:pointer;">
            <span style="font-weight:800; font-size:0.78rem; color:var(--accent-gold);"><i class="fa-solid fa-user-gear"></i> Project Manager</span>
            <span style="font-size:0.68rem; color:var(--text-muted); margin-top:2px;">Projects & Portfolio Only</span>
          </button>
        </div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Admin Email</label>
          <div class="input-with-icon">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input type="email" id="email" class="form-input" placeholder="admin@whiteleaf.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-with-icon">
            <i class="fa-regular fa-lock input-icon"></i>
            <input type="password" id="password" class="form-input" placeholder="••••••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-password" id="toggle-password" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; font-size:0.82rem; color:var(--text-muted);">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" checked style="accent-color:var(--accent-green);"> Remember session
          </label>
          <a href="#" onclick="alert('Demo Mode: Use the Auto-Fill button to populate admin credentials.'); return false;" style="color:var(--accent-green);">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary">
          <span>Sign In to Dashboard</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="login-footer-link">
        <a href="index.html"><i class="fa-solid fa-chevron-left" style="font-size:0.75rem;"></i> Back to Whiteleaf Main Website</a>
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
